name: Deploy Cloudflare unified console

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-unified-console-production
  cancel-in-progress: false

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROXY_WORKER_NAME: cinatoken-proxy
      ADMIN_WORKER_NAME: cinatoken-admin
      CHAIN_WORKER_NAME: cinatoken-chain-worker
      CHAIN_JOB_QUEUE_NAME: cinatoken-chain-jobs
      CHAIN_JOB_DLQ_NAME: cinatoken-chain-jobs-dlq
      D1_DATABASE_NAME: cinatoken
      D1_DATABASE_ID: f7588b56-e761-49fc-b944-4cd7d121fc21
      D1_MIGRATIONS_WORKER_NAME: cinatoken-d1-migrations
      DATABASE_DRIVER: postgres
      HYPERDRIVE_ID: e703c04c8505431d9e22ce6f8b371251
      CINACHAIN_CHAIN_ID: "84532"
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify remote Admin secret names
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler secret list --name cinatoken-admin --format json > "$RUNNER_TEMP/cinatoken-admin-secret-names.json"
          node -e 'const fs=require("node:fs"); const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const names=new Set(rows.map((row)=>row.name)); const required=["CINATOKEN_OIDC_CLIENT_SECRET","CINATOKEN_OIDC_BRIDGE_SECRET","CINATOKEN_OIDC_TRANSACTION_SECRET","SHARED_KEY_ENCRYPTION_SECRET"]; const missing=required.filter((name)=>!names.has(name)); if(missing.length){console.error(`Missing remote Admin secret names: ${missing.join(", ")}`); process.exit(1)}' "$RUNNER_TEMP/cinatoken-admin-secret-names.json"

      - name: Create ephemeral local secret placeholders
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs")
          const { randomBytes } = require("node:crypto")
          const names = [
            "CINATOKEN_OIDC_CLIENT_SECRET",
            "CINATOKEN_OIDC_BRIDGE_SECRET",
            "CINATOKEN_OIDC_TRANSACTION_SECRET",
            "SHARED_KEY_ENCRYPTION_SECRET",
          ]
          for (const name of names) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${randomBytes(48).toString("base64url")}\n`)
          }
          NODE

      - name: Build unified console for Cloudflare
        run: |
          npm run build -w @octafuse/core
          npm run gen:wrangler -- --remote
          npm run build:cf -w @octafuse/admin

      - name: Deploy unified console
        working-directory: packages/admin
        run: npx opennextjs-cloudflare deploy --config wrangler.jsonc
