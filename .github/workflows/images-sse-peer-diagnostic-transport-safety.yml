name: Images SSE peer diagnostic transport safety
on:
  pull_request:
    paths: ['scripts/deploy/**', 'packages/proxy/**', 'packages/core/**', 'package-lock.json', '.github/workflows/images-sse-peer-diagnostic-transport-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node node_modules/tsx/dist/cli.mjs --test --test-concurrency=2 scripts/deploy/staging-sse-peer-diagnostic-client.test.mjs scripts/deploy/staging-sse-peer-diagnostic-client-regression.test.mjs packages/proxy/scripts/staging/images-sse-peer-diagnostic-window.test.mjs packages/proxy/scripts/staging/images-sse-peer-diagnostic.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit -p packages/proxy/scripts/staging/tsconfig.json
