name: Images SSE completed window safety
on:
  pull_request:
    paths: ['packages/core/**', 'packages/proxy/**', 'scripts/deploy/**', 'package-lock.json', '.github/workflows/images-sse-window-safety.yml']
  push:
    branches: [main, develop]
    paths: ['packages/core/**', 'packages/proxy/**', 'scripts/deploy/**', 'package-lock.json', '.github/workflows/images-sse-window-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sse-window-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:node-index -w @octafuse/core
      - run: npm run typecheck:images:staging -w @octafuse/proxy
      # Synthetic private transport and local SQLite only. No deployment or cloud credentials.
      - run: node node_modules/tsx/dist/cli.mjs --test packages/proxy/scripts/staging/images-sse-window-probe.test.mjs packages/proxy/scripts/staging/images-sse-settlement-window.test.mjs packages/proxy/src/services/image-sse-delivery-gate.test.ts
