name: Images SSE native cancellation safety
on:
  pull_request:
    paths: ['packages/core/**', 'packages/proxy/**', 'scripts/deploy/**', 'package-lock.json', '.github/workflows/images-sse-cancel-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build:node-index -w @octafuse/core
      - run: npm run typecheck:images:staging -w @octafuse/proxy
      # No cloud credentials: signal, real SQLite, fixed timers and complete atomic cleanup.
      - run: node node_modules/tsx/dist/cli.mjs --test packages/proxy/scripts/staging/images-sse-cancel-observer.test.mjs packages/proxy/scripts/staging/images-sse-cancel-reconciliation.test.mjs packages/proxy/scripts/staging/images-sse-snapshot-fault-v2.test.mjs
