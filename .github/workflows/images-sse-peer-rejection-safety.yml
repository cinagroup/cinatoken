name: Images SSE peer rejection safety
on:
  pull_request:
    paths: ['packages/core/**', 'packages/proxy/**', 'scripts/deploy/**', 'package-lock.json', '.github/workflows/images-sse-peer-rejection-safety.yml']
  push:
    branches: [main, develop]
    paths: ['packages/core/**', 'packages/proxy/**', 'scripts/deploy/**', 'package-lock.json', '.github/workflows/images-sse-peer-rejection-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sse-peer-rejection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: node node_modules/tsx/dist/cli.mjs --test scripts/deploy/staging-sse-peer-rejection-capture.test.mjs packages/proxy/scripts/staging/images-sse-peer-rejection-run.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit -p packages/proxy/scripts/staging/tsconfig.json
