name: Images SSE Access transport safety
on:
  pull_request:
    paths: ['scripts/deploy/**', 'packages/proxy/**', 'packages/core/**', 'package-lock.json', '.github/workflows/images-sse-access-transport-safety.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node node_modules/tsx/dist/cli.mjs --test --test-concurrency=2 scripts/deploy/staging-sse-access-response.test.mjs scripts/deploy/staging-sse-ingress-confirmation.test.mjs scripts/deploy/staging-sse-recovery-access-v2.test.mjs scripts/deploy/staging-sse-capacity-sampler.test.mjs
