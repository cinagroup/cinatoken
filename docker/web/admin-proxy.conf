# Variable upstream preserves the original URI, including query string.
proxy_pass $web_admin_origin$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $web_public_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $web_connection_upgrade;
proxy_ssl_server_name on;
proxy_redirect off;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;
# Do not hide, collapse or rewrite Cookie, Origin, Location or Set-Cookie.
proxy_pass_request_headers on;
