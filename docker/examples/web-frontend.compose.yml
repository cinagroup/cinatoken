# Merge with gateway.compose.yml. Both images MUST use the same WEB_RELEASE_PATH.
# The manifest header prevents rendering against assets from another release.
services:
  gateway-web:
    image: ${GATEWAY_WEB_IMAGE:?set an immutable Web entry image}
    ports:
      - "${GATEWAY_WEB_PORT:-18080}:8080"
    environment:
      CINATOKEN_ADMIN_UPSTREAM: http://gateway-admin:8789
      CINATOKEN_WEB_PUBLIC_ENABLED: ${CINATOKEN_WEB_PUBLIC_ENABLED:-false}
      # Private shells are selected by the entry; the SSR sidecar only serves public routes.
      CINATOKEN_WEB_ACCOUNT_ENABLED: ${CINATOKEN_WEB_ACCOUNT_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_DASHBOARD_ENABLED: ${CINATOKEN_WEB_ADMIN_DASHBOARD_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_USERS_ENABLED: ${CINATOKEN_WEB_ADMIN_USERS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_USER_DETAIL_ENABLED: ${CINATOKEN_WEB_ADMIN_USER_DETAIL_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_PROVIDERS_ENABLED: ${CINATOKEN_WEB_ADMIN_PROVIDERS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_MODELS_ENABLED: ${CINATOKEN_WEB_ADMIN_MODELS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_ENDPOINTS_ENABLED: ${CINATOKEN_WEB_ADMIN_ENDPOINTS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_ROUTES_ENABLED: ${CINATOKEN_WEB_ADMIN_ROUTES_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_DATA_POLICIES_ENABLED: ${CINATOKEN_WEB_ADMIN_DATA_POLICIES_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_PRESETS_ENABLED: ${CINATOKEN_WEB_ADMIN_PRESETS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_GUARDRAILS_ENABLED: ${CINATOKEN_WEB_ADMIN_GUARDRAILS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_RELIABILITY_ENABLED: ${CINATOKEN_WEB_ADMIN_RELIABILITY_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_MODEL_ANALYTICS_ENABLED: ${CINATOKEN_WEB_ADMIN_MODEL_ANALYTICS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_PROVIDER_ANALYTICS_ENABLED: ${CINATOKEN_WEB_ADMIN_PROVIDER_ANALYTICS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_USER_ANALYTICS_ENABLED: ${CINATOKEN_WEB_ADMIN_USER_ANALYTICS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_REQUEST_LOGS_ENABLED: ${CINATOKEN_WEB_ADMIN_REQUEST_LOGS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_BUDGET_AUDIT_ENABLED: ${CINATOKEN_WEB_ADMIN_BUDGET_AUDIT_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_TOOL_INVOCATIONS_ENABLED: ${CINATOKEN_WEB_ADMIN_TOOL_INVOCATIONS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_CONFIG_TIMEZONE_ENABLED: ${CINATOKEN_WEB_ADMIN_CONFIG_TIMEZONE_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_CONFIG_ENABLED: ${CINATOKEN_WEB_ADMIN_CONFIG_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_ACCESS_KEYS_ENABLED: ${CINATOKEN_WEB_ADMIN_ACCESS_KEYS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_KEYS_ENABLED: ${CINATOKEN_WEB_ADMIN_KEYS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_SHARED_KEYS_ENABLED: ${CINATOKEN_WEB_ADMIN_SHARED_KEYS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_TOOLS_ENABLED: ${CINATOKEN_WEB_ADMIN_TOOLS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_PLAYGROUND_ENABLED: ${CINATOKEN_WEB_ADMIN_PLAYGROUND_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_SIMULATOR_ENABLED: ${CINATOKEN_WEB_ADMIN_SIMULATOR_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_WITHDRAWALS_ENABLED: ${CINATOKEN_WEB_ADMIN_WITHDRAWALS_ENABLED:-false}
      CINATOKEN_WEB_ADMIN_NFT_MINTS_ENABLED: ${CINATOKEN_WEB_ADMIN_NFT_MINTS_ENABLED:-false}
      CINATOKEN_WEB_SSR_UPSTREAM: http://gateway-web-ssr:8791
      CINATOKEN_WEB_PROXY_ORIGINS: ${CINATOKEN_WEB_PROXY_ORIGINS:-}
    depends_on:
      - gateway-admin
      - gateway-web-ssr
  gateway-web-ssr:
    image: ${GATEWAY_WEB_SSR_IMAGE:?set the SSR image from the same immutable release}
    environment:
      CINATOKEN_ADMIN_UPSTREAM: http://gateway-admin:8789
      CINATOKEN_WEB_PUBLIC_ENABLED: ${CINATOKEN_WEB_PUBLIC_ENABLED:-false}
      CINATOKEN_WEB_PUBLIC_ORIGIN: ${CINATOKEN_WEB_PUBLIC_ORIGIN:-}
      CINATOKEN_WEB_PROXY_ORIGINS: ${CINATOKEN_WEB_PROXY_ORIGINS:-}
    expose:
      - "8791"
