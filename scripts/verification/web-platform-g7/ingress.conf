# Only this dedicated, unpublished TLS service may attach to the QA network.
map $http_upgrade $g7_connection { default upgrade; '' ''; }
map $uri $g7_upstream {
    ~^/(?:api/v1|v1)(?:/|$) gateway-proxy:8787;
    default gateway-web:8080;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /tls/app.test.crt;
    ssl_certificate_key /tls/app.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 421;
}
server {
    listen 443 ssl;
    server_name app.test;
    ssl_certificate /tls/app.test.crt;
    ssl_certificate_key /tls/app.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ssl_server_name != app.test) { return 421; }
    if ($http_host !~* "^app[.]test(?::443)?$") { return 421; }
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;
    location / {
        proxy_pass http://$g7_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host app.test;
        proxy_set_header X-Forwarded-Host app.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $g7_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Origin, Cookie, Location and separate Set-Cookie fields are preserved.
    }
}
