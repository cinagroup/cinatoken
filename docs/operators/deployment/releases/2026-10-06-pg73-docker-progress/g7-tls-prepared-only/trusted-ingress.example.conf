# Future owned Linux app.test-only fixture. Private Web/Admin ports must not be published.
map $http_upgrade $qa_connection_upgrade { default upgrade; '' ''; }
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /tls/app.test.crt;
    ssl_certificate_key /tls/app.test.key;
    return 421;
}
server {
    listen 443 ssl;
    server_name app.test;
    ssl_certificate /tls/app.test.crt;
    ssl_certificate_key /tls/app.test.key;
    if ($ssl_server_name != app.test) { return 421; }
    if ($http_host !~* "^app[.]test(?::443)?$") { return 421; }
    location / {
        proxy_pass http://gateway-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host app.test;
        proxy_set_header X-Forwarded-Host app.test;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qa_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Preserve browser Origin, Cookie, Location and separate Set-Cookie fields.
    }
}
