name: v364 owned direct Workerd socket cancellation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v364-direct-socket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct-socket-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install the existing dependency lock
        run: npm ci
      - name: Diagnose direct sockets once while retaining the unchanged strict baseline
        timeout-minutes: 7
        env:
          DIAGNOSTIC_OUT: ${{ runner.temp }}/v364-direct-socket-once-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python3 scripts/diagnostics/v364-direct-socket/execute-owned-linux.py
          --repo "$GITHUB_WORKSPACE"
          --out "$DIAGNOSTIC_OUT"
          --execute-linux
      - name: Retain SHA-bound raw receipts on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v364-direct-socket-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v364-direct-socket-once-${{ github.run_id }}-${{ github.run_attempt }}/
            scripts/diagnostics/v364-direct-socket/
            .github/workflows/v364-direct-socket.yml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
